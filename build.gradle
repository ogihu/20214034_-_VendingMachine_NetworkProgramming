plugins {
    id 'java'
    id 'application'
}

group = 'vending'
version = '1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

application {
    mainClass = 'vending.ClientMain'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '-Dfile.encoding=UTF-8'
}

jar {
    manifest {
        attributes 'Main-Class': 'vending.ClientMain'
    }
}

tasks.register('fatJar', Jar) {
    group = 'build'
    description = 'Railway/배포용 전체 JAR'
    archiveBaseName = 'vending-all'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    manifest {
        attributes 'Main-Class': 'vending.ClientMain'
    }
}

tasks.register('buildCloudImage') {
    group = 'deployment'
    description = 'fatJar 후 Docker Cloud 이미지 빌드'
    dependsOn fatJar
    doLast {
        exec {
            commandLine 'docker', 'build', '-t', 'vending-cloud', '.'
        }
    }
}

tasks.register('runServer1', JavaExec) {
    group = 'application'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'vending.server.ServerMain'
    systemProperty 'server.role', 'SERVER1'
    systemProperty 'server.port', '9090'
    systemProperty 'peer.host', '127.0.0.1'
    systemProperty 'peer.port', '9091'
    systemProperty 'backup.sync.host', '127.0.0.1'
    systemProperty 'backup.sync.port', '9092'
}

